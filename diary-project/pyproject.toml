[tool.poetry]
name = "muse"
version = "0.1.0"
description = "Web application for keeping a personal diary"
authors = ["Artem Razmyslov <89083284426@mail.ru>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "6.0.1"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.1"
gunicorn = "^21.2.0"
djangorestframework = "^3.14.0"
djangorestframework-simplejwt = "^5.3.0"
django-filter = "^23.5"
cryptography = "^42.0.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"
pytest-django = "^4.8.0"
pytest-cov = "^4.1.0"
factory-boy = "^3.3.0"
black = "^24.0.0"
mypy = "^1.8.0"
flake8 = "^7.0.0"
isort = "^5.13.0"

# ===== НАСТРОЙКИ ИНСТРУМЕНТОВ =====

[tool.black]
line-length = 119
target-version = ['py312']
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.github
  | deploy
  | migrations
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
force_single_line = true
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
line_length = 119
skip = [".git", ".venv", "venv", "__pycache__"]
skip_glob = [
    "**/migrations/**",
    "docs/*",
    "*.txt",
    ".git",
    ".github",
    ".venv",
    ".deploy",
    ".mypy_cache",
    ".pytest_cache"
]
combine_as_imports = true
known_first_party = ['diary', 'accounts', 'entries', 'api']
src_paths = ['.']

[tool.mypy]
python_version = "3.12"
show_error_codes = true
ignore_missing_imports = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
strict_optional = true
exclude = [".git", ".venv", "venv", "__pycache__"]
exclude_gitignore = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "diary.settings"
python_files = "test_*.py"
testpaths = ["accounts", "entries", "api"]
addopts = "-v"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
