services:
  db:
    image: postgres:15
    container_name: diary_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diary_db}
      POSTGRES_USER: ${POSTGRES_USER:-diary_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diary_password}
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diary_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    container_name: diary_web
    command: >
      sh -c "
        poetry run python manage.py migrate &&
        poetry run python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
