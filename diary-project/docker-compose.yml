version: '3.8'

services:
  # PostgreSQL
  db:
    image: postgres:15
    container_name: diary_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diary_db}
      POSTGRES_USER: ${POSTGRES_USER:-diary_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diary_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diary_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django приложение
  web:
    build: .
    container_name: diary_web
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - DB_NAME=${DB_NAME:-diary_db}
      - DB_USER=${DB_USER:-diary_user}
      - DB_PASSWORD=${DB_PASSWORD:-diary_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: diary_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/staticfiles
      - media_volume:/media
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: